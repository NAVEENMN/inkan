[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inkan"
version = "0.2.0"
description = "Fast, stable uniform cubic B-spline KAN layers via truncated power form with bounded-coordinate evaluation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Naveen Mysore"},
]
keywords = ["kan", "kolmogorov-arnold", "b-spline", "neural-network", "deep-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "torchvision>=0.15",
    "matplotlib>=3.5",
]

[project.urls]
Homepage = "https://github.com/NAVEENMN/inkan"
Repository = "https://github.com/NAVEENMN/inkan"

[tool.setuptools.packages.find]
where = ["src"]
